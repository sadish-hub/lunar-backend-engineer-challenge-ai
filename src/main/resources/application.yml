server:
  port: 8088

spring:
  application:
    name: lunar-rockets
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lunar}
    username: ${SPRING_DATASOURCE_USERNAME:lunar}
    password: ${SPRING_DATASOURCE_PASSWORD:lunar}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

lunar:
  apply:
    enabled: true
    poll-interval-ms: 250
    claim-batch-size: 8
    max-messages-per-claim: 100
    claim-lease-seconds: 60
    version-conflict-max-retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true

