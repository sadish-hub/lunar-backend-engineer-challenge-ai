services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lunar
      POSTGRES_USER: lunar
      POSTGRES_PASSWORD: lunar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunar -d lunar"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - lunar_pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lunar
      SPRING_DATASOURCE_USERNAME: lunar
      SPRING_DATASOURCE_PASSWORD: lunar
    ports:
      - "8088:8088"

volumes:
  lunar_pgdata:
