server:
  port: 8088

spring:
  application:
    name: lunar-rockets
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lunar}
    username: ${SPRING_DATASOURCE_USERNAME:lunar}
    password: ${SPRING_DATASOURCE_PASSWORD:lunar}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
